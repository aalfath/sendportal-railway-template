<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>
    # Railway's edge sets X-Forwarded-For to the real client address.
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 100.64.0.0/10
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 "%a %>s %r %b %D"
</VirtualHost>
ServerName localhost
ServerTokens Prod
ServerSignature Off
